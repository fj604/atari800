<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atari800 Web</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M8 2l5 12h-2l-1.2-3H6.2L5 14H3L8 2zm0 4.2L7 9h2L8 6.2z' fill='%23fff'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #ddd; }
    .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    .panel { padding: 1rem; border-right: 1px solid #333; background: #1a1a1a; }
    .viewer { display: flex; align-items: center; justify-content: center; background: #000; }
    h1 { margin-top: 0; font-size: 1.2rem; }
    label, button, input, select { font-size: 0.95rem; }
    button { margin: 0.2rem 0.3rem 0.2rem 0; padding: 0.4rem 0.6rem; }
    .hint { color: #aaa; font-size: 0.85rem; }
    #canvas { max-width: 100%; max-height: 100vh; image-rendering: pixelated; }
    #status { white-space: pre-wrap; font-size: 0.85rem; color: #9ecbff; }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Atari800 Web</h1>
      <p class="hint">Upload emulator images (ROMs, cartridges, disks, tapes, executables, states). They are saved in browser storage (IndexedDB) and can be launched any time.</p>
      <input id="add-files" type="file" multiple />
      <div>
        <button id="refresh-list">Refresh</button>
        <button id="delete-selected">Delete selected</button>
      </div>
      <label for="images">Stored images</label><br />
      <select id="images" size="10" style="width:100%"></select>
      <div>
        <button id="launch">Launch selected</button>
        <button id="clear-arg">Boot without media</button>
      </div>
      <div>
        <button id="toggle-sound">Sound: ON</button>
        <button id="toggle-fullscreen">Toggle fullscreen</button>
      </div>
      <p class="hint">Current media argument: <span id="current-media">(none)</span></p>
      <pre id="status"></pre>
    </section>
    <section class="viewer">
      <canvas id="canvas" width="336" height="240" oncontextmenu="event.preventDefault()"></canvas>
    </section>
  </main>

  <script src="wrapper.js"></script>
</body>
</html>
