<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atari800 Web</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main class="layout">
    <header class="toolbar">
      <button id="audio-unlock">Enable Audio</button>
      <button id="fullscreen-btn">Fullscreen</button>
      <label class="import-label">Import media<input id="media-import" type="file" multiple /></label>
      <button id="refresh-library">Refresh Library</button>
      <label><input id="touch-enabled" type="checkbox" checked /> Touch controls</label>
    </header>

    <section id="emulator-container" class="emulator-wrap">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
      <div id="touch-controls" hidden>
        <div class="dpad">
          <button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
        </div>
        <button class="fire" data-key="ControlLeft">FIRE</button>
      </div>
    </section>

    <section class="info-panels">
      <div>
        <h3>Status</h3>
        <p id="status">Booting...</p>
      </div>
      <div>
        <h3>Controls</h3>
        <p>Joystick 0: Arrow keys + Left Ctrl fire. Atari OPTION/SELECT/START: 1/2/3. UI: F1.</p>
      </div>
      <div>
        <h3>Media Library (IndexedDB)</h3>
        <ul id="media-list"></ul>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  {{{ SCRIPT }}}
</body>
</html>
